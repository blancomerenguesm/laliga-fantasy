name: Actualizar Puntos LaLiga Fantasy

on:
  workflow_dispatch:

concurrency:
  group: actualizar-puntos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar extractor de puntos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python extractor_github.py

      - name: Guardar cambios en puntos.json y estado_relevo.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add puntos.json estado_relevo.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualización automática de puntos"
            git pull --rebase origin main
            git push
          fi